<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f6f8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="任务看板" />
<meta name="robots" content="noindex, nofollow" />
<title>任务看板</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css?v=1.3.0" />
</head>
<body>

<!-- 登录 -->
<section id="view-login" class="view">
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-mark">任</div>
      <h1>任务看板</h1>
      <p class="brand-sub">仅限授权账户访问的私有面板</p>
    </div>

    <div class="panel">
      <button id="btn-workbuddy" class="btn btn-primary" type="button">使用 WorkBuddy 登录</button>
      <p class="hint" id="login-hint">推荐使用与电脑端相同的账号，登录后即可查看你的任务。</p>

      <div class="divider"><span>或使用邮箱验证码</span></div>

      <form id="form-email" autocomplete="on">
        <label class="field">
          <span>邮箱</span>
          <input id="input-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <button id="btn-send-code" class="btn btn-ghost" type="button">获取验证码</button>
        <label class="field" id="field-code" hidden>
          <span>验证码</span>
          <input id="input-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位数字" />
        </label>
        <button id="btn-email-login" class="btn btn-primary" type="submit">登录</button>
      </form>

      <p class="err" id="login-error" hidden></p>
    </div>
    <p class="footnote">数据由电脑端的「任务同步」按钮上传，不点按钮就不会更新。电脑关机或 App 关闭后，这里仍能读到上一次同步的记录。</p>
  </div>
</section>

<!-- 绑定 -->
<section id="view-bind" class="view" hidden>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-mark">任</div>
      <h1>绑定这台电脑</h1>
      <p class="brand-sub">首次使用需要一次设备授权</p>
    </div>
    <div class="panel">
      <p class="hint">请输入电脑端安装时生成的一次性绑定码（10 位）。绑定成功后，本账号将独占这台电脑的任务数据。</p>
      <form id="form-bind">
        <label class="field">
          <span>绑定码</span>
          <input id="input-bind" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="10" placeholder="XXXXXXXXXX" required />
        </label>
        <button class="btn btn-primary" type="submit">确认绑定</button>
      </form>
      <p class="err" id="bind-error" hidden></p>
      <button id="btn-logout-bind" class="btn btn-text" type="button">退出登录</button>
    </div>
  </div>
</section>

<!-- 主面板 -->
<section id="view-app" class="view" hidden>
  <header class="topbar">
    <div class="topbar-main">
      <div class="topbar-title">
        <span id="host-name">任务看板</span>
      </div>
      <div class="topbar-sub">
        <span id="sync-time">—</span>
        <button id="btn-refresh" class="icon-btn" type="button" aria-label="刷新">↻</button>
      </div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <input id="search" class="search" type="search" placeholder="搜索任务标题或工作区" />
  </div>

  <main id="list" class="list"></main>
  <div id="empty" class="empty" hidden></div>

  <footer class="footer">
    <button id="btn-logout" class="btn btn-text" type="button">退出登录</button>
  </footer>
</section>

<!-- 详情抽屉：窄屏为底部抽屉，宽屏为右侧面板 + 右侧导航 -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="任务详情" tabindex="-1">
    <div class="sheet-scroll" id="sheet-scroll">
      <div class="sheet-grab"></div>
      <div id="sheet-body"></div>
    </div>

    <!-- 常驻工具条：关闭按钮始终可见，不随内容滚动 -->
    <div class="sheet-tools">
      <button id="btn-nav" class="nav-toggle" type="button" aria-expanded="false" aria-controls="sheet-nav">
        <span class="nav-toggle-icon" aria-hidden="true">☰</span>
        <span>导航</span>
      </button>
      <button id="btn-close" class="close-fab" type="button" aria-label="关闭详情" title="关闭" data-close="1">✕</button>
    </div>

    <aside id="sheet-nav" class="sheet-nav" aria-label="对话导航" aria-hidden="true">
      <div class="nav-head">
        <span class="nav-head-title">导航</span>
        <button id="btn-nav-close" class="nav-close" type="button" aria-label="收起导航">✕</button>
      </div>

      <div class="nav-sections">
        <section class="nav-sec is-open" data-sec="tasks">
          <button class="nav-sec-head" type="button" aria-expanded="true">
            <span>对话列表</span><span class="nav-sec-count" id="nav-count"></span>
          </button>
          <div class="nav-sec-body" id="nav-body"></div>
        </section>

        <section class="nav-sec" data-sec="turns">
          <button class="nav-sec-head" type="button" aria-expanded="false">
            <span>消息目录</span><span class="nav-sec-count" id="turn-count"></span>
          </button>
          <div class="nav-sec-body" id="turn-body"></div>
        </section>

        <section class="nav-sec" data-sec="files">
          <button class="nav-sec-head" type="button" aria-expanded="false">
            <span>文件</span><span class="nav-sec-count" id="file-count"></span>
          </button>
          <div class="nav-sec-body" id="file-body"></div>
        </section>
      </div>
    </aside>
    <div class="nav-scrim" id="nav-scrim" hidden></div>
  </div>
</div>

<!-- 文件预览 -->
<div id="fileview" class="fileview" hidden>
  <div class="fileview-backdrop" data-fileclose="1"></div>
  <div class="fileview-panel" role="dialog" aria-modal="true" aria-label="文件预览">
    <div class="fileview-head">
      <span id="fileview-name" class="fileview-name"></span>
      <a id="fileview-download" class="fileview-dl" download>下载</a>
      <button id="fileview-close" class="close-fab close-fab-sm" type="button" aria-label="关闭预览" data-fileclose="1">✕</button>
    </div>
    <div class="fileview-body" id="fileview-body"></div>
  </div>
</div>

<!-- 轻提示 -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- 站点配置：从 config.example.js 复制为 config.js 后填写。缺失时页面会给出提示 -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@0.1.4/lib/index.global.js"></script>
<script src="app.js?v=1.3.0"></script>
</body>
</html>
